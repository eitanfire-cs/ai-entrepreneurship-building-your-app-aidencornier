# Checks your repository every time you push.
#
# Green check: no secrets committed, your app is at the top level, and (for Node apps) it builds.
# Works for npm projects and for pnpm projects such as Replit's.
# Red X: click it, open the failed step, and read the message. It tells you what to fix.

name: Repo check

on:
  push:
  workflow_dispatch:

concurrency:
  group: repo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::A .env file is committed: $found"
            echo "Your API keys are now on GitHub. Revoke or regenerate each key at the service that"
            echo "gave it to you, then run:  git rm --cached $found  and commit and push."
            echo "See 'Need help?' in the assignment."
            exit 1
          fi
          echo "No .env files committed."

      - name: App is at the top level
        id: layout
        run: |
          if [ -f package.json ] || [ -f index.html ]; then
            echo "App files found at the top level."
            exit 0
          fi
          nested=$(git ls-files | grep -E '(^|/)(package\.json|index\.html)$' | grep -v node_modules | head -1)
          if [ -n "$nested" ]; then
            echo "::error::Your app is inside a folder: found $nested"
            echo "Move the app's files up so package.json (or index.html) sits next to README.md."
            exit 1
          fi
          echo "::notice::No app code yet. That's expected until you copy your app in."

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22

      # Replit builds pnpm workspaces, and their package.json refuses npm ("Use pnpm instead").
      - name: Pick npm or pnpm
        id: pm
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-workspace.yaml ] || [ -f pnpm-lock.yaml ] \
             || grep -qE '"packageManager" *: *"pnpm' package.json \
             || grep -q 'Use pnpm instead' package.json; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "This project uses pnpm. Replit projects do."
            if [ ! -f pnpm-workspace.yaml ] && grep -q 'Use pnpm instead' package.json; then
              echo "::error::This looks like a Replit project, but pnpm-workspace.yaml is missing."
              echo "Only part of the project was copied. Download the whole project from Replit again"
              echo "and copy EVERYTHING in the unzipped folder to the top level of your repository,"
              echo "including pnpm-workspace.yaml and the artifacts folder. Keep this repository's"
              echo "README.md and .gitignore."
              exit 1
            fi
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Node apps only)
        if: hashFiles('package.json') != ''
        env:
          # Replit's Vite configs refuse to start without these. Harmless for everything else.
          PORT: "5173"
          BASE_PATH: /
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            npm install -g pnpm@10
            pnpm install
            pnpm run --if-present build
          else
            npm ci || npm install
            npm run build --if-present
          fi
